spring.config.import=optional:file:.env

spring.application.name=caronas

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/caronas}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.render-hidden-markers-before-checkboxes=true

remember.me.key=${REMEMBER_ME_KEY:chavePadraoParaDesenvolvimentoLocalSegura}