<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: html(template=~{::section})}">
<section>

	<!-- Últimas Caronas Disponíveis -->
	<h3 class="mb-3">Minhas caronas</h3>
	<div class="row">
		<!-- Cartão 1: Carona Disponível (Destacado) -->
		<div th:each="c: ${caronas}" class="col-md-4 mb-3">

			<!-- Cartão Dinâmico: Altera a borda e o fundo dependendo do estado da carona -->
			<div class="card h-100 shadow"
				th:classappend="${c.cancelada} ? 'border-secondary border-2 bg-secondary bg-opacity-10 opacity-75' : (${c.esgotada} and !${c.estouNaCarona} ? 'border-danger border-2 bg-danger bg-opacity-10 opacity-75' : (${c.estouNaCarona} ? 'border-success border-2 bg-success bg-opacity-10' : 'border-primary border-2'))">

				<div class="card-body d-flex flex-column">

					<!-- Cabeçalho e Badge de Status -->
					<div class="d-flex justify-content-between align-items-start mb-2">
						<h5 class="card-title fw-bold mb-0"
							th:classappend="${c.cancelada} ? 'text-secondary' : (${c.esgotada} and !${c.estouNaCarona} ? 'text-danger' : (${c.estouNaCarona} ? 'text-success' : 'text-primary'))"
							th:text="${c.direcao}">Natal ➔ Lajes</h5>

						<!-- Badge dinâmico -->
						<span class="badge fs-6"
							th:classappend="${c.cancelada} ? 'bg-secondary' : (${c.esgotada} and !${c.estouNaCarona} ? 'bg-danger' : (${c.estouNaCarona} ? 'bg-success' : 'bg-primary'))">
							<i class="bi"
							th:classappend="${c.cancelada} ? 'bi-x-circle-fill' : (${c.esgotada} and !${c.estouNaCarona} ? 'bi-slash-circle-fill' : (${c.estouNaCarona} ? 'bi-check-circle-fill' : 'bi-car-front'))"></i>
							<span
							th:text="${c.cancelada} ? 'CANCELADA' : (${c.esgotada} and !${c.estouNaCarona} ? 'ESGOTADA' : (${c.estouNaCarona} ? 'Confirmada' : 'DISPONÍVEL'))">DISPONÍVEL</span>
						</span>
					</div>

					<!-- Data e Motorista -->
					<h6 class="card-subtitle mb-2 text-muted"
						th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm (EEEE)')}">15/06/2026
						08:00</h6>
					<p class="card-text mb-1">
						<strong>Motorista:</strong> <span th:text="${c.motorista}">João
							Silva</span>
					</p>

					<!-- Título dos Passageiros com cor dinâmica -->
					<p class="card-text mb-1 fw-semibold"
						th:classappend="${c.cancelada} ? 'text-secondary fw-bold' : (${c.esgotada} and !${c.estouNaCarona} ? 'text-danger fw-bold' : (${c.estouNaCarona} ? 'text-success' : 'text-primary'))">
						<strong>Passageiros:</strong>
					</p>

					<!-- Lista de Vagas / Passageiros -->
					<ol class="small ps-3 mb-3"
						th:classappend="${c.cancelada} ? 'text-dark' : (${c.esgotada} and !${c.estouNaCarona} ? 'text-dark' : (${c.estouNaCarona} ? 'text-success' : 'text-muted'))">
						<li th:each="i : ${#numbers.sequence(0, c.vagas - 1)}"><span
							th:text="${i < c.passageiros.size() ? c.passageiros[i] : ''}"></span>
						</li>
					</ol>

					<!-- Rodapé do Card: Valor e Botões de Ação Condicionais -->
					<div
						class="d-flex justify-content-between align-items-center mt-auto">

						<!-- Preço (Fica tachado se estiver cancelada ou esgotada) -->
						<span class="fs-5 fw-bold"
							th:classappend="${c.cancelada} or (${c.esgotada} and !${c.estouNaCarona}) ? 'text-muted text-decoration-line-through' : 'text-success'"
							th:text="${#numbers.formatCurrency(c.valor)}">R$ 35,00</span>

						<div class="d-flex gap-2">
							<!-- Se estiver cancelada ou esgotada -->
							<a th:if="${c.cancelada} or (${c.esgotada} and !${c.estouNaCarona})" href="#"
								class="btn btn-secondary btn-sm disabled fw-bold">Indisponível</a>

							<!-- Se o usuário já estiver na carona -->
							<!-- 							<a -->
							<!-- 								th:if="${c.estouNaCarona} and !${c.cancelada} and !${c.esgotada}" -->
							<!-- 								href="/caronas/detalhes" class="btn btn-outline-danger btn-sm">Sair -->
							<!-- 								da Carona</a> -->

							<form
								th:if="${c.estouNaCarona} and !${c.cancelada} and !${c.souMotorista}"
								th:action="@{/caronas/{id}/sair(id=${c.id})}" method="post">
								<button type="submit" class="btn btn-outline-danger btn-sm">Sair
									da Carona</button>
							</form>

							<!-- Se estiver disponível e o usuário NÃO estiver nela -->
							<!-- 							<a -->
							<!-- 								th:if="!${c.estouNaCarona} and !${c.cancelada} and !${c.esgotada}" -->
							<!-- 								href="/caronas/detalhes" class="btn btn-outline-success btn-sm">Reservar</a> -->

							<form
								th:if="!${c.estouNaCarona} and !${c.cancelada} and !${c.esgotada}"
								th:action="@{/caronas/{id}/reservar(id=${c.id})}" method="post">
								<button type="submit" class="btn btn-outline-success btn-sm">Reservar</button>
							</form>

							<!-- Botão de Detalhes (Sempre aparece) -->
							<a th:href="@{/caronas/{id}(id=${c.id})}"
								class="btn btn-outline-primary btn-sm">Mais Detalhes</a>
						</div>
					</div>

				</div>
			</div>

		</div>
	</div>

</section>
</html>
