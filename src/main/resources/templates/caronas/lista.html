<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: html(template=~{::section})}">
<section>
	<!--     Banner de Apresentação -->
	<div
		class="d-block d-md-none p-4 mb-4 bg-primary text-white rounded-3 shadow-sm text-center">
		<div class="container-fluid d-grid gap-2 justify-content-center">
			<a href="/caronas/novo"
				class="btn btn-light btn-lg fw-bold text-primary w-100">Oferecer
				uma Carona</a> 
<!-- 			<a href="/caronas/minhas" -->
<!-- 				class="btn btn-light btn-lg fw-bold text-primary w-100">Minhas -->
<!-- 				Reservas</a> -->
		</div>
	</div>


	<!-- Formulário de Filtro por Data -->
	<div class="card shadow-sm mb-4">
		<div class="card-body">
			<form method="get" action="/caronas" class="row g-3 align-items-end">
				<div class="col-md-5">
					<label for="dataInicio" class="form-label fw-bold">Data
						Inicial:</label> <input type="datetime-local" id="dataInicio"
						name="dataInicio" class="form-control"
						th:value="${dataInicio != null ? #temporals.format(dataInicio, 'yyyy-MM-dd''T''HH:mm') : ''}" />
				</div>

				<div class="col-md-5">
					<label for="dataFim" class="form-label fw-bold">Data Final:</label>
					<input type="datetime-local" id="dataFim" name="dataFim"
						class="form-control"
						th:value="${dataFim != null ? #temporals.format(dataFim, 'yyyy-MM-dd''T''HH:mm') : ''}" />
				</div>

				<div class="col-md-2 d-flex align-items-center">
					<div class="form-check form-switch mt-4">
						<input class="form-check-input" type="checkbox" id="minhas"
							name="minhas" value="true"
							th:checked="${minhas != null and minhas}"> <label
							class="form-check-label fw-bold" for="minhas">Apenas
							Minhas Reservas</label>
					</div>
				</div>

				<div class="col-md-2 d-flex gap-2">
					<button type="submit" class="btn btn-primary w-100">Filtrar</button>
					<a href="/caronas" class="btn btn-outline-secondary"
						title="Limpar filtro">Limpar</a>
				</div>
			</form>
		</div>
	</div>

	<!-- Últimas Caronas Disponíveis -->
	<h3 class="mb-3">Próximas caronas</h3>
	<div class="row">
		<!-- Cartão 1: Carona Disponível (Destacado) -->
		<div th:fragment="lista-caronas" th:each="c: ${caronas}"
			class="col-md-4 mb-3">

			<!-- Cartão Dinâmico: Altera a borda e o fundo dependendo do estado da carona -->
			<div class="card h-100 shadow"
        th:classappend="${c.cancelada} ? 'border-secondary border-2 bg-secondary bg-opacity-10 opacity-75' : 
                        (${c.realizada} ? 'border-secondary border-2 bg-light opacity-75' : 
                        (${c.esgotada} and !${c.estouNaCarona} ? 'border-danger border-2 bg-danger bg-opacity-10 opacity-75' : 
                        (${c.estouNaCarona} ? 'border-success border-2 bg-success bg-opacity-10' : 'border-primary border-2')))">

        <div class="card-body d-flex flex-column">

            <!-- Cabeçalho e Badge de Status -->
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title fw-bold mb-0 text-muted"
                    th:classappend="${c.cancelada} ? 'text-secondary' : (${c.realizada} ? 'text-secondary' : (${c.esgotada} and !${c.estouNaCarona} ? 'text-danger' : (${c.estouNaCarona} ? 'text-success' : 'text-primary')))"
                    th:text="${c.direcao}">Natal ➔ Lajes</h5>

                <!-- Badge dinâmico -->
                <span class="badge fs-6"
                    th:classappend="${c.cancelada} ? 'bg-secondary' : (${c.realizada} ? 'bg-secondary' : (${c.esgotada} and !${c.estouNaCarona} ? 'bg-danger' : (${c.estouNaCarona} ? 'bg-success' : 'bg-primary')))">
                    <i class="bi"
                       th:classappend="${c.cancelada} ? 'bi-x-circle-fill' : (${c.realizada} ? 'bi-clock-history' : (${c.esgotada} and !${c.estouNaCarona} ? 'bi-slash-circle-fill' : (${c.estouNaCarona} ? 'bi-check-circle-fill' : 'bi-car-front')))"></i>
                    <span th:text="${c.cancelada} ? 'CANCELADA' : (${c.realizada} ? 'REALIZADA' : (${c.esgotada} and !${c.estouNaCarona} ? 'ESGOTADA' : (${c.estouNaCarona} ? 'Confirmada' : 'DISPONÍVEL')))">DISPONÍVEL</span>
                </span>
            </div>

            <!-- Data e Motorista -->
            <h6 class="card-subtitle mb-2 text-muted"
                th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm (EEEE)')}">15/06/2026 08:00</h6>
            <p class="card-text mb-1">
                <strong>Motorista:</strong> <span th:text="${c.motorista}">João Silva</span>
            </p>

            <!-- Título dos Passageiros -->
            <p class="card-text mb-1 fw-semibold text-muted">
                <strong>Passageiros:</strong>
            </p>

            <!-- Lista de Vagas / Passageiros -->
            <ol class="small ps-3 mb-3 text-muted">
                <li th:each="i : ${#numbers.sequence(0, c.vagas - 1)}">
                    <span th:text="${i < c.passageiros.size() ? c.passageiros[i] : ''}"></span>
                </li>
            </ol>

            <!-- Rodapé do Card: Valor e Botões de Ação Condicionais -->
            <div class="d-flex justify-content-between align-items-center mt-auto">

                <!-- Preço (Fica tachado se passada, cancelada ou esgotada) -->
                <span class="fs-5 fw-bold text-muted"
                    th:classappend="${c.cancelada} or ${c.realizada} or (${c.esgotada} and !${c.estouNaCarona}) ? 'text-decoration-line-through' : 'text-success'"
                    th:text="${#numbers.formatCurrency(c.valor)}">R$ 35,00</span>

                <div class="d-flex gap-2">

                    <!-- Se a carona já foi realizada, esgotada ou cancelada -->
                    <a th:if="${c.cancelada} or ${c.realizada} or (${c.esgotada} and !${c.estouNaCarona})"
                       href="#" class="btn btn-secondary btn-sm disabled fw-bold">
                       <span>Indisponível</span>
                    </a>

                    <!-- Ações para caronas no futuro -->
                    <div th:if="!${c.realizada} and ${c.data.isAfter(#temporals.createNow())}">
                        <!-- Se o usuário já estiver na carona -->
                        <form th:if="${c.estouNaCarona} and !${c.cancelada} and !${c.souMotorista}"
                            th:action="@{/caronas/{id}/sair(id=${c.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Sair da Carona</button>
                        </form>

                        <!-- Se estiver disponível e o usuário NÃO estiver nela -->
                        <form th:if="!${c.estouNaCarona} and !${c.cancelada} and !${c.esgotada}"
                            th:action="@{/caronas/{id}/reservar(id=${c.id})}" method="post">
                            <button type="submit" class="btn btn-outline-success btn-sm">Reservar</button>
                        </form>

                        <!-- Se o usuário for o motorista -->
                        <a th:if="${c.souMotorista} and !${c.cancelada}"
                            th:href="@{/caronas/{id}/editar(id=${c.id})}"
                            class="btn btn-outline-primary btn-sm">Editar</a>
                    </div>

                    <!-- Botão de Detalhes (Sempre visível) -->
                    <a th:href="@{/caronas/{id}(id=${c.id})}"
                        class="btn btn-outline-primary btn-sm">Mais Detalhes</a>
                </div>
            </div>

        </div>
    </div>

		</div>
	</div>

</section>
</html>
