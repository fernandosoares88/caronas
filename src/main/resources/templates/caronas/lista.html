<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:hx="http://www.w3.org/1999/xhtml"
	th:replace="~{layout :: html(template=~{::section})}">
<section>

<!-- Formulário de Filtro por Data -->
	<div class="card shadow-sm border-0 mb-3">
		<!-- Cabeçalho do Card Clicável para Colapsar/Expandir (Mais compacto) -->
		<div class="card-header d-flex justify-content-between align-items-center bg-white py-2 px-3 border-bottom border-light-subtle role-button"
			 style="cursor: pointer;"
			 data-bs-toggle="collapse" 
			 data-bs-target="#collapseFiltros"
			 aria-expanded="false" 
			 aria-controls="collapseFiltros">
			
			<h5 class="mb-0 fw-semibold text-dark fs-6 user-select-none d-flex align-items-center gap-2">
				<i class="bi bi-funnel text-dark"></i> Filtros
			</h5>

			<div class="d-flex align-items-center gap-2">
				<!-- Botão de Limpar Filtros -->
				<a href="/caronas/limpar"
					class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center border-0 px-2 py-1 fs-6"
					title="Restaurar filtros padrões"
					onclick="event.stopPropagation();">
					<i class="bi bi-arrow-counterclockwise fs-6"></i>
					<span class="d-none d-sm-inline ms-1 small">Limpar</span>
				</a>

				<!-- Ícone do Collapse -->
				<button class="btn btn-sm btn-outline-secondary border-0 p-1 d-flex align-items-center justify-content-center" type="button"
					title="Minimizar/Expandir filtros">
					<i id="iconeCollapseFiltros" class="bi bi-chevron-down fs-6"></i>
				</button>
			</div>
		</div>

		<!-- Corpo do card colapsável (Colapsado por padrão: classe 'collapse' sem 'show') -->
		<div class="collapse" id="collapseFiltros">
			<div class="card-body p-3">
				<form method="get" action="/caronas" class="row g-2 align-items-end"
					hx-get="/caronas" hx-target="#lista-caronas-container"
					hx-push-url="true" hx-trigger="change" hx-indicator="#indicator">

					<!-- Data Inicial (Lado a lado no Mobile: col-6) -->
					<div class="col-6 col-md-4">
						<label for="filtroDataInicio" class="form-label x-small fw-semibold text-secondary mb-1">Data Inicial:</label> 
						<input type="datetime-local" id="filtroDataInicio" name="filtroDataInicio" class="form-control form-control-sm border-light-subtle px-2"
							th:value="${filtroDataInicio != null ? #temporals.format(filtroDataInicio, 'yyyy-MM-dd''T''HH:mm') : ''}" />
					</div>

					<!-- Data Final (Lado a lado no Mobile: col-6) -->
					<div class="col-6 col-md-4">
						<label for="filtroDataFim" class="form-label x-small fw-semibold text-secondary mb-1">Data Final:</label> 
						<input type="datetime-local" id="filtroDataFim" name="filtroDataFim" class="form-control form-control-sm border-light-subtle px-2"
							th:value="${filtroDataFim != null ? #temporals.format(filtroDataFim, 'yyyy-MM-dd''T''HH:mm') : ''}" />
					</div>

					<!-- Checkbox Switch (Aproveita a linha no mobile) -->
					<div class="col-12 col-md-4 pt-1 pt-md-0">
						<div class="form-check form-switch m-0 d-flex align-items-center gap-2">
							<input class="form-check-input mt-0" type="checkbox"
								id="filtroMinhasCaronas" name="filtroMinhasCaronas" value="true"
								th:checked="${filtroMinhasCaronas != null and filtroMinhasCaronas}">
							<label class="form-check-label small fw-semibold text-secondary" for="filtroMinhasCaronas">
								Apenas Minhas Reservas
							</label>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>	

	<!-- Título e Botão de Adição -->
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h5 class="mb-0 text-dark fw-bold fs-5">Próximas caronas</h5>
		<a href="/caronas/novo"
			class="btn btn-outline-primary border-0 fs-3 lh-1 p-2 d-flex align-items-center justify-content-center"
			title="Oferecer uma Carona" aria-label="Oferecer uma Carona">
			<i class="bi bi-plus-circle-fill"></i>
		</a>
	</div>

	<div id="indicator">
		<!-- Indicador HTMX Centralizado -->
		<img class="htmx-indicator mx-auto mb-3" width="100"
			src="/imagens/bars.svg" alt="Carregando..."
			style="filter: grayscale(100%); opacity: 0.5;" />

		<div id="lista-caronas-container" class="htmx-load-hide">
			<div class="row">
				<!-- Loop de Caronas -->
				<div th:fragment="lista-caronas" th:each="c: ${caronas}"
					class="col-md-4 mb-3">

					<!-- Cartão com Fundo Cinza quando Cancelada, Realizada ou Esgotada/Lotada -->
					<div class="card h-100 shadow-sm border border-light-subtle"
						th:classappend="${c.cancelada} or ${c.realizada} or (${c.esgotada} and !${c.estouNaCarona}) ? 'bg-secondary bg-opacity-10 opacity-75' : 
                            (${c.estouNaCarona} ? 'bg-success bg-opacity-10' : 'bg-white')">

						<div class="card-body d-flex flex-column p-3">

							<!-- Cabeçalho e Ícone de Status -->
							<div
								class="d-flex justify-content-between align-items-center mb-2">
								<h6 class="card-title fw-bold mb-0"
									th:classappend="${c.cancelada} or ${c.realizada} or (${c.esgotada} and !${c.estouNaCarona}) ? 'text-secondary' : (${c.estouNaCarona} ? 'text-success' : 'text-dark')"
									th:text="${c.direcao}">Natal ➔ Lajes</h6>

								<span class="fs-4 d-flex align-items-center"
									th:title="${c.cancelada} ? 'Cancelada' : (${c.realizada} ? 'Realizada' : (${c.esgotada} and !${c.estouNaCarona} ? 'Esgotada' : (${c.estouNaCarona} ? 'Confirmada' : 'Disponível')))"
									th:classappend="${c.cancelada} or ${c.realizada} or (${c.esgotada} and !${c.estouNaCarona}) ? 'text-secondary' : (${c.estouNaCarona} ? 'text-success' : 'text-dark')">
									<i class="bi"
										th:classappend="${c.cancelada} ? 'bi-x-circle-fill' : (${c.realizada} ? 'bi-clock-history' : (${c.esgotada} and !${c.estouNaCarona} ? 'bi-slash-circle-fill' : (${c.estouNaCarona} ? 'bi-check-circle-fill' : 'bi-car-front-fill')))"></i>
								</span>
							</div>

							<!-- Data com Dia da Semana (Simplificado) -->
							<p class="card-subtitle small fw-medium text-secondary mb-2"
								th:text="${#temporals.format(c.data, 'EEE, dd/MM/yyyy HH:mm')}">Seg,
								15/06/2026 08:00</p>

							<!-- Motorista e Total de Passageiros -->
							<div
								class="d-flex justify-content-between align-items-center mb-2">
								<p
									class="card-text small text-dark-emphasis mb-0 d-flex align-items-center">
									<i class="bi bi-person me-1 fs-6 text-secondary"></i>
									<span th:text="${c.motorista}">João Silva</span>
								</p>

								<!-- Contador de Passageiros -->
								<span
									class="badge bg-light text-secondary border border-light-subtle small px-2 py-1 d-flex align-items-center gap-1"
									title="Passageiros confirmados / Total de vagas"> <i
										class="bi bi-people-fill fs-6 text-secondary"></i> <span><span
										class="fw-bold text-dark" th:text="${c.passageiros.size()}">2</span>/<span
										th:text="${c.vagas}">4</span></span>
								</span>
							</div>

							<!-- Rodapé: Valor e Ações -->
							<div
								class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top border-light-subtle">

								<!-- Preço -->
								<span class="fw-bold fs-6 text-dark"
									th:classappend="${c.cancelada} or ${c.realizada} or (${c.esgotada} and !${c.estouNaCarona}) ? 'text-muted text-decoration-line-through' : ''"
									th:text="${#numbers.formatCurrency(c.valor)}">R$ 35,00</span>

								<!-- Ações Ativas -->
								<div class="d-flex gap-1">
									<div
										th:if="!${c.realizada} and ${c.data.isAfter(#temporals.createNow())}">
										<!-- Sair -->
										<form
											th:if="${c.estouNaCarona} and !${c.cancelada} and !${c.souMotorista}"
											th:action="@{/caronas/{id}/sair(id=${c.id})}" method="post"
											class="d-inline">
											<button type="submit"
												class="btn btn-sm btn-outline-danger border-0 p-2 d-inline-flex align-items-center justify-content-center"
												title="Sair da Carona" aria-label="Sair da Carona">
												<i class="bi bi-box-arrow-right fs-5"></i>
											</button>
										</form>

										<!-- Reservar -->
										<form
											th:if="!${c.estouNaCarona} and !${c.cancelada} and !${c.esgotada}"
											th:action="@{/caronas/{id}/reservar(id=${c.id})}"
											method="post" class="d-inline">
											<button type="submit"
												class="btn btn-sm btn-outline-success border-0 p-2 d-inline-flex align-items-center justify-content-center"
												title="Reservar Vaga" aria-label="Reservar Vaga">
												<i class="bi bi-plus-circle-fill fs-5"></i>
											</button>
										</form>

										<!-- Editar -->
<!-- 										<a th:if="${c.souMotorista} and !${c.cancelada}" -->
<!-- 											th:href="@{/caronas/{id}/editar(id=${c.id})}" -->
<!-- 											class="btn btn-sm btn-outline-primary border-0 p-2 d-inline-flex align-items-center justify-content-center" -->
<!-- 											title="Editar Carona" aria-label="Editar Carona"> -->
<!-- 											<i class="bi bi-pencil-square fs-5"></i> -->
<!-- 										</a> -->
									</div>

									<!-- Detalhes -->
									<a th:href="@{/caronas/{id}(id=${c.id})}"
										class="btn btn-sm btn-outline-secondary border-0 p-2 d-inline-flex align-items-center justify-content-center"
										title="Ver Detalhes" aria-label="Ver Detalhes">
										<i class="bi bi-chevron-right fs-5"></i>
									</a>
								</div>

							</div>

						</div>
					</div>

				</div>
			</div>
		</div>
	</div>

	<!-- Script para Alternar o Ícone do Filtro -->
	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const collapseElement = document.getElementById('collapseFiltros');
			const icone = document.getElementById('iconeCollapseFiltros');

			if (collapseElement && icone) {
				collapseElement.addEventListener('hide.bs.collapse',
						function() {
							icone.classList.remove('bi-chevron-up');
							icone.classList.add('bi-chevron-down');
						});

				collapseElement.addEventListener('show.bs.collapse',
						function() {
							icone.classList.remove('bi-chevron-down');
							icone.classList.add('bi-chevron-up');
						});
			}
		});
	</script>

</section>
</html>
