<!DOCTYPE html>
<html th:replace="~{layout :: html(template=~{::section})}" xmlns:th="http://www.thymeleaf.org">
<section>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border border-secondary-subtle">
                <div class="card-body p-4">

                    <form method="post" th:action="@{/caronas}" th:object="${caronaFormDTO}">
                        <input th:field="*{id}" type="hidden"/>

                        <div class="row g-3">
                            <!-- Rota -->
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary" for="direcao">Rota</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-light-subtle">
                                        <i class="bi bi-geo-alt-fill fs-6"></i>
                                    </span>
                                    <select class="form-select border-light-subtle" id="direcao" required
                                            th:field="*{direcao}">
                                        <option disabled selected value="">Selecione a rota</option>
                                        <option value="Natal ➔ Lajes">Natal ➔ Lajes</option>
                                        <option value="Lajes ➔ Natal">Lajes ➔ Natal</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Data e Horário -->
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-semibold text-secondary" for="data">Data e
                                    Horário</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-light-subtle">
                                        <i class="bi bi-calendar3 fs-6"></i>
                                    </span>
                                    <input class="form-control border-light-subtle" id="data" required
                                           th:field="*{data}" type="datetime-local">
                                </div>
                            </div>

                            <!-- Vagas -->
                            <div class="col-6 col-md-3">
                                <label class="form-label small fw-semibold text-secondary" for="vagas">Vagas</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-light-subtle px-2">
                                        <i class="bi bi-people-fill fs-6"></i>
                                    </span>
                                    <input class="form-control border-light-subtle" id="vagas" max="6"
                                           min="1" required th:field="*{vagas}" type="number">
                                </div>
                            </div>

                            <!-- Valor por Vaga -->
                            <div class="col-6 col-md-3">
                                <label class="form-label small fw-semibold text-secondary" for="valor">Valor
                                    (R$)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-light-subtle px-2">
                                        <i class="bi bi-currency-dollar fs-6"></i>
                                    </span>
                                    <input class="form-control border-light-subtle" id="valor" placeholder="0.00"
                                           required
                                           step="0.01" th:field="*{valor}" type="number">
                                </div>
                            </div>

                            <!-- Chave PIX -->
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary" for="pix">Chave PIX (para
                                    pagamento)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-light-subtle">
                                        <i class="bi bi-qr-code fs-6"></i>
                                    </span>
                                    <input class="form-control border-light-subtle" id="pix"
                                           placeholder="Ex: CPF, Telefone, E-mail ou Chave Aleatória"
                                           th:field="*{pix}"
                                           type="text">
                                </div>
                            </div>
                            <!-- Passageiros -->
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary" for="passageirosIds">Passageiros
                                    Confirmados</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary border-light-subtle">
                                        <i class="bi bi-person-check-fill fs-6"></i>
                                    </span>
                                    <select class="form-control border-light-subtle"
                                            id="passageirosIds"
                                            th:field="*{passageirosIds}"
                                            multiple
                                            placeholder="Digite o nome do passageiro...">
                                        <!-- Renderiza as opções existentes para edição -->
                                        <option th:each="p : ${caronaFormDTO.passageiros}"
                                                th:value="${p.id}"
                                                th:text="${p.nome}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <!-- Observações -->
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary" for="observacoes">Observações
                                    / Regras</label>
                                <textarea class="form-control border-light-subtle" id="observacoes"
                                          placeholder="Ex: Ponto de encontro, malas, tolerância de atraso..." rows="3"
                                          th:field="*{observacoes}"></textarea>
                            </div>

                            <!-- Botões de Ação -->
                            <div class="col-12 d-flex gap-2 pt-2">
                                <a class="btn btn-outline-secondary px-3 py-2 fw-semibold d-inline-flex align-items-center justify-content-center gap-1"
                                   href="/caronas">
                                    <i class="bi bi-arrow-left fs-5"></i>
                                    <span>Voltar</span>
                                </a>
                                <button class="btn btn-primary flex-grow-1 py-2 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 shadow-sm"
                                        th:text="${caronaFormDTO.id != null} ? 'Salvar Alterações' : 'Publicar Carona'"
                                        type="submit">
                                    Publicar Carona
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
    <script>
        new TomSelect("#passageirosIds", {
            valueField: 'id',
            labelField: 'nome',
            searchField: 'nome',
            placeholder: 'Digite o nome do passageiro...',
            persist: false,
            create: false,

            // 1. Plugins: adiciona o botão de remover em cada item selecionado
            plugins: ['remove_button', 'no_backspace_delete'],

            // 2. Delay (Debounce): aguarda 500ms (meio segundo) após parar de digitar
            loadThrottle: 500,

            onItemAdd: function() {
                this.setTextboxValue(''); // Limpa o texto digitado na busca
                this.refreshOptions(false); // Atualiza as opções do dropdown
            },

            // Função de carregamento remoto via REST
            load: function(query, callback) {
                // Evita requisição se a busca estiver vazia (opcional)
                if (query.length < 2) return callback();

                var url = '/rest/usuarios?q=' + encodeURIComponent(query);
                fetch(url)
                    .then(response => response.json())
                    .then(json => {
                        callback(json);
                    })
                    .catch(() => {
                        callback();
                    });
            },

            render: {
                option: function(item, escape) {
                    return '<div>' + escape(item.nome) + '</div>';
                },
                item: function(item, escape) {
                    return '<div>' + escape(item.nome) + '</div>';
                }
            }
        });
    </script>
</section>
</html>
