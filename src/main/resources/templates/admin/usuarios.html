<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(template=~{::section})}">
<section>
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm border border-secondary-subtle">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold text-dark mb-0">Gerenciamento de Usuários</h4>
                        <a th:href="@{/caronas}" class="btn btn-outline-secondary btn-sm fw-semibold">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle border-light-subtle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Nome</th>
                                    <th>Telefone</th>
                                    <th>Papéis</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${usuarios}">
                                    <td th:text="${u.id}">1</td>
                                    <td class="fw-semibold text-dark" th:text="${u.nome}">Nome do Usuário</td>
                                    <td th:text="${u.telefone}">(84) 99999-9999</td>
                                    <td>
                                        <span th:each="p : ${u.papeis}" 
                                              class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle me-1" 
                                              th:text="${p.authority}">
                                            ROLE_USER
                                        </span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/usuarios/{id}/resetar-senha(id=${u.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Tem certeza que deseja resetar a senha deste usuário para a senha padrão (123456)?');">
                                            <button type="submit" class="btn btn-outline-warning btn-sm fw-semibold d-inline-flex align-items-center gap-1">
                                                <i class="bi bi-key-fill"></i>
                                                <span>Resetar Senha</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
