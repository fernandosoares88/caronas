<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: html(template=~{::section})}">
<section>
	<div class="row justify-content-center">
		<div class="col-md-8 col-lg-5">
			
			<div class="card shadow-sm border border-secondary-subtle">
				<div class="card-body p-4">
					
					<form method="post" th:action="@{/cadastro}">
						
						<div class="row g-3">
							<!-- Nome Completo -->
							<div class="col-12">
								<label for="nome" class="form-label small fw-semibold text-secondary">Nome Completo</label>
								<div class="input-group">
									<span class="input-group-text bg-light text-secondary border-light-subtle">
										<i class="bi bi-person fs-6"></i>
									</span>
									<input type="text" class="form-control border-light-subtle" id="nome" name="nome" required placeholder="Ex: João da Silva">
								</div>
							</div>

							<!-- Telefone (Login) -->
							<div class="col-12">
								<label for="telefone" class="form-label small fw-semibold text-secondary">Telefone (Login)</label>
								<div class="input-group">
									<span class="input-group-text bg-light text-secondary border-light-subtle">
										<i class="bi bi-phone fs-6"></i>
									</span>
									<input type="tel" class="form-control border-light-subtle" id="telefone" name="telefone" required placeholder="(84) 99999-9999">
								</div>
							</div>

							<!-- Senha -->
							<div class="col-12">
								<label for="senha" class="form-label small fw-semibold text-secondary">Senha</label>
								<div class="input-group">
									<span class="input-group-text bg-light text-secondary border-light-subtle">
										<i class="bi bi-lock fs-6"></i>
									</span>
									<input type="password" class="form-control border-light-subtle" id="senha" name="senha" required placeholder="Crie uma senha segura">
								</div>
							</div>

							<!-- Botão Cadastrar -->
							<div class="col-12 pt-1">
								<button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 shadow-sm">
									<i class="bi bi-person-plus fs-5"></i>
									<span>Criar Conta</span>
								</button>
							</div>

							<!-- Link para Login -->
							<div class="col-12 text-center pt-1">
								<p class="mb-0 small text-secondary">
									Já possui uma conta? 
									<a href="/login" class="text-primary text-decoration-none fw-semibold">Entrar</a>
								</p>
							</div>
						</div>

					</form>
				</div>
			</div>

		</div>
	</div>

	<script>
		document.addEventListener('input', function (e) {
			if (e.target && (e.target.id === 'telefone' || e.target.id === 'username')) {
				let input = e.target;
				let v = input.value.replace(/\D/g, '');
				
				if (input.dataset.backspace === 'true') {
					delete input.dataset.backspace;
					input.value = v;
					return;
				}
				
				if (v.length > 11) v = v.slice(0, 11);
				
				if (v.length > 6) {
					input.value = '(' + v.substring(0,2) + ') ' + v.substring(2,7) + '-' + v.substring(7,11);
				} else if (v.length > 2) {
					input.value = '(' + v.substring(0,2) + ') ' + v.substring(2,7);
				} else if (v.length > 0) {
					input.value = '(' + v;
				} else {
					input.value = '';
				}
			}
		});

		document.addEventListener('keydown', function (e) {
			if (e.target && (e.target.id === 'telefone' || e.target.id === 'username')) {
				if (e.key === 'Backspace') {
					e.target.dataset.backspace = 'true';
				}
			}
		});
	</script>
</section>
</html>
