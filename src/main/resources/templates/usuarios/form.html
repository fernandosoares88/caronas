<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: html(template=~{::section})}">
<section>
	<div class="row justify-content-center">
		<div class="col-md-6">
			<div class="card shadow-sm p-4">
				<h2 class="mb-4 text-center">Criar Conta</h2>

				<form method="post" th:action="@{/cadastro}">
					<div class="mb-3">
						<label for="nome" class="form-label">Nome Completo</label> <input
							type="text" class="form-control" id="nome" name="nome" required
							placeholder="Ex: João da Silva">
					</div>

					<div class="mb-3">
						<label for="telefone" class="form-label">Telefone (Login)</label>
						<input type="tel" class="form-control" id="telefone"
							name="telefone" required placeholder="Ex: (84) 99999-9999">
					</div>

					<div class="mb-3">
						<label for="senha" class="form-label">Senha</label> <input
							type="password" class="form-control" id="senha" name="senha"
							required placeholder="Crie uma senha segura">
					</div>

					<button type="submit"
						class="btn btn-success w-100 py-2 fw-bold mb-3">Cadastrar</button>

					<div class="text-center">
						<p class="mb-0 text-muted">
							Já possui uma conta? <a href="/login"
								class="text-primary text-decoration-none fw-bold">Entrar</a>
						</p>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script>
    document.addEventListener('input', function (e) {
        if (e.target && (e.target.id === 'telefone' || e.target.id === 'username')) {
            let input = e.target;
            let v = input.value.replace(/\D/g, '');
            
            if (input.dataset.backspace === 'true') {
                delete input.dataset.backspace;
                input.value = v;
                return;
            }
            
            if (v.length > 11) v = v.slice(0, 11);
            
            if (v.length > 6) {
                input.value = '(' + v.substring(0,2) + ') ' + v.substring(2,7) + '-' + v.substring(7,11);
            } else if (v.length > 2) {
                input.value = '(' + v.substring(0,2) + ') ' + v.substring(2,7);
            } else if (v.length > 0) {
                input.value = '(' + v;
            } else {
                input.value = '';
            }
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.target && (e.target.id === 'telefone' || e.target.id === 'username')) {
            if (e.key === 'Backspace') {
                e.target.dataset.backspace = 'true';
            }
        }
    });
</script>
	
</section>
</html>
