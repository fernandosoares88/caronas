<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: html(template=~{::section})}">
<section>
	<div class="row justify-content-center">
		<div class="col-md-8 col-lg-5">
			
			<div class="card shadow-sm border border-light-subtle">
				<div class="card-body p-4">
					
					<form method="post" th:action="@{/login}">
						
						<div class="row g-3">
							<!-- Telefone (Usuário) -->
							<div class="col-12">
								<label for="username" class="form-label small fw-semibold text-secondary">Telefone (Usuário)</label>
								<div class="input-group">
									<span class="input-group-text bg-light text-secondary border-light-subtle">
										<i class="bi bi-phone fs-6"></i>
									</span>
									<input type="tel" class="form-control border-light-subtle" id="username"
										name="username" required placeholder="(84) 99999-9999">
								</div>
							</div>

							<!-- Senha -->
							<div class="col-12">
								<label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
								<div class="input-group">
									<span class="input-group-text bg-light text-secondary border-light-subtle">
										<i class="bi bi-lock fs-6"></i>
									</span>
									<input type="password" class="form-control border-light-subtle" id="password"
										name="password" required placeholder="Sua senha">
								</div>
							</div>

							<!-- Lembrar de mim -->
							<div class="col-12">
								<div class="form-check">
									<input type="checkbox" class="form-check-input border-light-subtle" id="remember-me" name="remember-me">
									<label class="form-check-label small text-secondary fw-medium" for="remember-me">
										Lembrar de mim
									</label>
								</div>
							</div>

							<!-- Botão Entrar -->
							<div class="col-12">
								<button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 shadow-sm">
									<i class="bi bi-box-arrow-in-right fs-5"></i>
									<span>Entrar</span>
								</button>
							</div>

							<!-- Link para Cadastro -->
							<div class="col-12 text-center pt-1">
								<p class="mb-0 small text-secondary">
									Ainda não tem uma conta? 
									<a href="/cadastro" class="text-primary text-decoration-none fw-semibold">Cadastre-se</a>
								</p>
							</div>
						</div>

					</form>
				</div>
			</div>

		</div>
	</div>

	<script>
		document.addEventListener('input', function(e) {
			if (e.target && (e.target.id === 'telefone' || e.target.id === 'username')) {
				let input = e.target;
				let v = input.value.replace(/\D/g, '');

				if (input.dataset.backspace === 'true') {
					delete input.dataset.backspace;
					input.value = v;
					return;
				}

				if (v.length > 11) v = v.slice(0, 11);

				if (v.length > 6) {
					input.value = '(' + v.substring(0, 2) + ') ' + v.substring(2, 7) + '-' + v.substring(7, 11);
				} else if (v.length > 2) {
					input.value = '(' + v.substring(0, 2) + ') ' + v.substring(2, 7);
				} else if (v.length > 0) {
					input.value = '(' + v;
				} else {
					input.value = '';
				}
			}
		});

		document.addEventListener('keydown', function(e) {
			if (e.target && (e.target.id === 'telefone' || e.target.id === 'username')) {
				if (e.key === 'Backspace') {
					e.target.dataset.backspace = 'true';
				}
			}
		});
	</script>
</section>
</html>
