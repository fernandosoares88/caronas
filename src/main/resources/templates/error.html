<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: html(template=~{::section})}">
<section>
	<div class="row justify-content-center">
		<div class="col-md-8 col-lg-5">
			
			<div class="card shadow-sm border border-light-subtle text-center">
				<div class="card-body p-4 p-md-5">
					
					<!-- Ícone do Erro -->
					<div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle mb-3" style="width: 64px; height: 64px;">
						<i class="bi bi-exclamation-triangle-fill fs-2"></i>
					</div>

					<!-- Mensagem -->
					<h5 class="fw-bold text-dark mb-2">Algo deu errado!</h5>
					<p class="small text-secondary mb-4">
						Desculpe pelo transtorno. Nossa equipe foi notificada e você pode tentar novamente.
					</p>

					<!-- Botão de Ação -->
					<div class="d-flex justify-content-center">
						<a th:href="@{/}" class="btn btn-primary px-4 py-2 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 shadow-sm">
							<i class="bi bi-house-door fs-5"></i>
							<span>Voltar ao Início</span>
						</a>
					</div>

				</div>
			</div>

		</div>
	</div>
</section>
</html>
