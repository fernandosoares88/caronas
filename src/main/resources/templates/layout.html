<!DOCTYPE html>
<html lang="pt-br" xmlns:hx="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    <title th:text="${titulo} ?: 'Caronas'">Caronas</title>

    <link href="/imagens/icon-180.png" rel="apple-touch-icon"
          sizes="180x180">
    <link href="/imagens/icon-32.png" rel="icon" sizes="32x32"
          type="image/png">
    <link href="/imagens/icon-16.png" rel="icon" sizes="16x16"
          type="image/png">

    <!-- Tom Select - Uso de Selects Dinâmicos -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/js/tom-select.complete.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.6.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- HTMX -->
    <script crossorigin="anonymous"
            integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc"
            src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0"></script>

    <style>
        /* Esconde o indicador por padrão */
        .htmx-indicator {
            display: none;
        }

        /* Quando qualquer formulário/elemento com requisição ativa é acionado, esconde o conteúdo de carregamento */
        .htmx-request .htmx-load-hide, .htmx-request.htmx-load-hide {
            display: none !important;
        }

        /* Mostra o indicador genérico quando a requisição está ativa dentro de um wrapper */
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
            display: block !important;
        }

        /*.ts-wrapper.form-control.form-control-sm.border-light-subtle.px-2.single  {*/
        /*    min-height: 31px !important;*/
        /*    height: 31px !important;*/
        /*}*/
    </style>

    <!-- Transformando em um PWA -->
    <!-- Link para o Manifesto -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta content="#0d6efd" name="theme-color">

    <!-- Script para Registrar o Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                    .catch(err => console.log('Falha ao registrar o Service Worker', err));
            });
        }
    </script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar Suave com Fundo Claro e Borda Sutil -->
<nav class="navbar navbar-expand-lg bg-white border-bottom border-secondary-subtle shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2"
           href="/">
            <span>Caronas</span>
        </a>
        <button class="navbar-toggler border-0 p-2" data-bs-target="#navbarNav"
                data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
            </ul>
            <ul class="navbar-nav align-items-lg-center gap-2 gap-lg-0">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-primary btn-sm border-0 fw-semibold px-3 ms-lg-2 py-2"
                       th:href="@{/login}">Entrar</a>
                </li>

                <!-- Usuário Autenticado -->
                <li class="nav-item d-flex align-items-center me-lg-1"
                    sec:authorize="isAuthenticated()">
    <span class="navbar-text small text-secondary fw-semibold">
        <span>Olá,</span>
        <span class="text-dark fw-bold"
              th:text="${#strings.arraySplit(#authentication.principal.nome, ' ')[0]}">Fernando</span>
    </span>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-outline-secondary btn-sm border-0 fw-semibold px-3 ms-lg-1 py-2 d-inline-flex align-items-center gap-1"
                       th:href="@{/perfil}">
<!--                        <i class="bi bi-person-circle"></i>-->
                        <span>Meu Perfil</span>
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-outline-secondary btn-sm border-0 fw-semibold px-3 ms-lg-1 py-2 d-inline-flex align-items-center gap-1"
                       th:href="@{/admin/usuarios}">
<!--                        <i class="bi bi-people-fill"></i>-->
                        <span>Usuários</span>
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form class="d-inline" method="post" th:action="@{/logout}">
                        <button class="btn btn-outline-secondary btn-sm border-0 fw-semibold px-3 ms-lg-1 py-2 d-inline-flex align-items-center gap-1"
                                type="submit">
<!--                            <i class="bi bi-box-arrow-right"></i>-->
                            <span>Sair</span>
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>


<!-- Conteúdo Dinâmico -->
<main class="container my-4 flex-grow-1">

    <!-- Mensagens do Sistema com Contraste Suave -->
    <div th:if="${success}">
        <div
                class="alert alert-success bg-success-subtle text-success-emphasis border border-success-subtle alert-dismissible fade show shadow-sm d-flex align-items-center"
                role="alert">
            <i class="bi bi-check-circle-fill fs-5 me-2"></i>
            <span th:text="${success}">Mensagem do sistema</span>
            <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                    type="button"></button>
        </div>
    </div>
    <div th:if="${warning}">
        <div
                class="alert alert-warning bg-warning-subtle text-warning-emphasis border border-warning-subtle alert-dismissible fade show shadow-sm d-flex align-items-center"
                role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
            <span th:text="${warning}">Mensagem do sistema</span>
            <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                    type="button"></button>
        </div>
    </div>
    <div th:if="${danger}">
        <div class="alert alert-danger bg-danger-subtle text-danger-emphasis border border-danger-subtle alert-dismissible fade show shadow-sm d-flex align-items-center"
             role="alert">
            <i class="bi bi-x-square-fill fs-5 me-2"></i>
            <span th:text="${danger}">Mensagem do sistema</span>
            <button aria-label="Close" class="btn-close" data-bs-dismiss="alert"
                    type="button"></button>
        </div>
    </div>

    <div th:replace="${template}"></div>
</main>

<!-- Botão Voltar ao Topo -->
<button aria-label="Voltar ao topo"
        class="btn btn-light bg-white bg-opacity-100 rounded-circle shadow border border-1 border-secondary position-fixed bottom-0 end-0 mb-4 me-3 mb-md-5 me-md-4 d-none justify-content-center align-items-center"
        id="btnTopo"
        style="width: 45px; height: 45px; z-index: 1050;"
        title="Voltar ao topo" type="button">
    <i class="bi bi-arrow-up fs-5 text-secondary-emphasis"></i>
</button>

<!-- Rodapé Suave -->
<footer
        class="text-center text-secondary py-3 mt-auto border-top border-secondary-subtle bg-white">
    <div class="container">
        <p class="mb-0 small fw-medium">&copy; 2026 Caronas. Todos os
            direitos reservados.</p>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para controlar o Botão Voltar ao Topo -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const btnTopo = document.getElementById("btnTopo");

        if (btnTopo) {
            window.addEventListener("scroll", function () {
                if (window.scrollY > 200) {
                    btnTopo.classList.remove("d-none");
                    btnTopo.classList.add("d-flex");
                } else {
                    btnTopo.classList.remove("d-flex");
                    btnTopo.classList.add("d-none");
                }
            });

            btnTopo.addEventListener("click", function () {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        }
    });
</script>
</body>
</html>
