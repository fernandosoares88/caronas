<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	xmlns:hx="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${titulo} ?: 'Caronas'">Caronas</title>

<link rel="apple-touch-icon" sizes="180x180"
	href="/imagens/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32"
	href="/imagens/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16"
	href="/imagens/icon-16.png">

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script
	src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
	integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
	crossorigin="anonymous"></script>

<!-- Link para o Manifesto -->
<link rel="manifest" th:href="@{/manifest.json}">
<meta name="theme-color" content="#0d6efd">

<!-- Script para Registrar o Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Service Worker registrado com sucesso!', reg))
              .catch(err => console.log('Falha ao registrar o Service Worker', err));
      });
  }
</script>
<style>

/* Esconde o indicador por padrão */
.htmx-indicator {
	display: none;
}

/* Quando qualquer formulário/elemento com requisição ativa é acionado, esconde o conteúdo de carregamento */
.htmx-request .htmx-load-hide, .htmx-request.htmx-load-hide {
	display: none !important;
}

/* Mostra o indicador genérico quando a requisição está ativa dentro de um wrapper */
.htmx-request .htmx-indicator, .htmx-request.htmx-indicator {
	display: block !important;
}
</style>

</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<!-- Navbar Suave com Fundo Claro e Borda Sutil -->
	<nav
		class="navbar navbar-expand-lg bg-white border-bottom border-light-subtle shadow-sm sticky-top">
		<div class="container">
			<a
				class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2"
				href="/">
				<span>Caronas</span>
			</a>
			<button class="navbar-toggler border-0 p-2" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav me-auto">
				</ul>
				<ul class="navbar-nav align-items-lg-center gap-2 gap-lg-0">
					<li sec:authorize="!isAuthenticated()" class="nav-item"><a
							class="btn btn-outline-primary btn-sm border-0 fw-semibold px-3 ms-lg-2 py-2"
							th:href="@{/login}">Entrar</a></li>

					<!-- Usuário Autenticado -->
					<li sec:authorize="isAuthenticated()"
						class="nav-item d-flex align-items-center me-lg-2"><span
						class="navbar-text small text-secondary fw-semibold"> <span>Olá,</span>
							<span class="text-dark fw-bold"
							th:text="${#strings.arraySplit(#authentication.principal.nome, ' ')[0]}">Fernando</span>
					</span></li>

					<li sec:authorize="isAuthenticated()" class="nav-item">
						<form th:action="@{/logout}" method="post" class="d-inline">
							<button type="submit"
								class="btn btn-outline-secondary btn-sm border-0 fw-semibold px-3 ms-lg-2 py-2">
								Sair</button>
						</form>
					</li>
				</ul>
			</div>
		</div>
	</nav>



	<!-- Conteúdo Dinâmico -->
	<main class="container my-4 flex-grow-1">

		<!-- Mensagens do Sistema com Contraste Suave -->
		<div th:if="${msg}">
			<div
				class="alert alert-success bg-success-subtle text-success-emphasis border border-success-subtle alert-dismissible fade show shadow-sm d-flex align-items-center"
				role="alert">
				<i class="bi bi-check-circle-fill fs-5 me-2"></i>
				<span th:text="${msg}">Mensagem do sistema</span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"
					aria-label="Close"></button>
			</div>
		</div>
		<div th:if="${msg2}">
			<div
				class="alert alert-success bg-success-subtle text-success-emphasis border border-success-subtle alert-dismissible fade show shadow-sm d-flex align-items-center"
				role="alert">
				<i class="bi bi-check-circle-fill fs-5 me-2"></i>
				<span th:text="${msg2}">Mensagem do sistema</span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"
					aria-label="Close"></button>
			</div>
		</div>

		<div th:replace="${template}"></div>
	</main>

	<!-- Botão Voltar ao Topo -->
	<button type="button" id="btnTopo"
		class="btn btn-light bg-white bg-opacity-100 rounded-circle shadow border border-1 border-secondary position-fixed bottom-0 end-0 mb-4 me-3 mb-md-5 me-md-4 d-none justify-content-center align-items-center"
		style="width: 45px; height: 45px; z-index: 1050;"
		title="Voltar ao topo" aria-label="Voltar ao topo">
		<i class="bi bi-arrow-up fs-5 text-secondary-emphasis"></i>
	</button>

	<!-- Rodapé Suave -->
	<footer
		class="text-center text-secondary py-3 mt-auto border-top border-light-subtle bg-white">
		<div class="container">
			<p class="mb-0 small fw-medium">&copy; 2026 Caronas. Todos os
				direitos reservados.</p>
		</div>
	</footer>

	<!-- Bootstrap 5 JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Script para controlar o Botão Voltar ao Topo -->
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const btnTopo = document.getElementById("btnTopo");

			if (btnTopo) {
				window.addEventListener("scroll", function () {
					if (window.scrollY > 200) {
						btnTopo.classList.remove("d-none");
						btnTopo.classList.add("d-flex");
					} else {
						btnTopo.classList.remove("d-flex");
						btnTopo.classList.add("d-none");
					}
				});

				btnTopo.addEventListener("click", function () {
					window.scrollTo({
						top: 0,
						behavior: "smooth"
					});
				});
			}
		});
	</script>
</body>
</html>
